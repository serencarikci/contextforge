
services:
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    container_name: contextforge-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - contextforge_prometheus_data:/prometheus
    depends_on:
      - api
    networks:
      - contextforge

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.3.1
    container_name: contextforge-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/contextforge-overview.json
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - contextforge_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - contextforge

  loki:
    profiles: ["obs"]
    image: grafana/loki:3.2.1
    container_name: contextforge-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - contextforge

volumes:
  contextforge_prometheus_data:
  contextforge_grafana_data:
