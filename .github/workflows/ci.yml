name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and unit/architecture tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.11.31"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m unit --cov=contextforge --cov-report=term-missing

      - name: Architecture tests
        run: uv run pytest -m architecture

      - name: Migration upgrade check (offline SQL)
        run: uv run alembic upgrade head --sql > /tmp/alembic-upgrade.sql

      - name: Dependency audit
        run: uv pip audit || uv run pip-audit || echo "pip audit soft-fail (tool unavailable)"

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.11.31"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis qdrant minio minio-init

      - name: Apply migrations
        env:
          CONTEXTFORGE_APP_ENVIRONMENT: test
          CONTEXTFORGE_POSTGRES_HOST: localhost
          CONTEXTFORGE_POSTGRES_PORT: "5432"
          CONTEXTFORGE_POSTGRES_USER: contextforge
          CONTEXTFORGE_POSTGRES_PASSWORD: contextforge_dev_password
          CONTEXTFORGE_POSTGRES_DATABASE: contextforge
        run: uv run alembic upgrade head

      - name: Integration tests with coverage
        env:
          CONTEXTFORGE_APP_ENVIRONMENT: test
          CONTEXTFORGE_APP_DEBUG: "true"
          CONTEXTFORGE_API_DOCS_ENABLED: "true"
          CONTEXTFORGE_POSTGRES_HOST: localhost
          CONTEXTFORGE_POSTGRES_PORT: "5432"
          CONTEXTFORGE_POSTGRES_USER: contextforge
          CONTEXTFORGE_POSTGRES_PASSWORD: contextforge_dev_password
          CONTEXTFORGE_POSTGRES_DATABASE: contextforge
          CONTEXTFORGE_REDIS_URL: redis://localhost:6379/0
          CONTEXTFORGE_QDRANT_URL: http://localhost:6333
          CONTEXTFORGE_MINIO_ENDPOINT: localhost:9000
          CONTEXTFORGE_MINIO_ACCESS_KEY: contextforge_minio
          CONTEXTFORGE_MINIO_SECRET_KEY: contextforge_minio_secret
          CONTEXTFORGE_MINIO_BUCKET: contextforge-documents
          CONTEXTFORGE_MINIO_SECURE: "false"
          CONTEXTFORGE_LOGGING_LEVEL: WARNING
          CONTEXTFORGE_LOGGING_FORMAT: console
          CONTEXTFORGE_SECURITY_SECRET_KEY: test-secret-key-not-for-production
        run: >
          uv run pytest -m "integration or unit or architecture"
          --cov=contextforge
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v

  infra:
    name: Helm, Terraform, SBOM
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Helm lint and template
        run: ./scripts/validate-helm.sh

      - name: Terraform fmt and validate
        run: ./scripts/validate-terraform.sh

      - name: Generate SBOM (syft or cyclonedx soft-fail)
        run: |
          if command -v syft >/dev/null 2>&1; then
            syft dir:. -o cyclonedx-json > sbom.cdx.json
          else
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /tmp
            if [ -x /tmp/syft ]; then
              /tmp/syft dir:. -o cyclonedx-json > sbom.cdx.json
            else
              echo "SBOM generation soft-fail: syft unavailable"
            fi
          fi
        continue-on-error: true

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: contextforge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Scout (optional soft-fail)
        continue-on-error: true
        run: |
          if docker scout version >/dev/null 2>&1; then
            docker scout cves contextforge-api:ci || true
          else
            echo "docker scout not available — soft-fail"
          fi
