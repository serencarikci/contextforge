api:
  replicaCount: 3
  env:
    CONTEXTFORGE_APP_ENVIRONMENT: production
    CONTEXTFORGE_API_DOCS_ENABLED: "false"
    CONTEXTFORGE_RATE_LIMIT_BACKEND: redis
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

ingestionWorker:
  replicaCount: 2

retentionWorker:
  replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

ingress:
  enabled: true
  hosts:
    - host: contextforge.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: contextforge-tls
      hosts:
        - contextforge.example.com

serviceMonitor:
  enabled: true

backupCronJob:
  enabled: true
  schedule: "0 1 * * *"
