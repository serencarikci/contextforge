{{- /* Secret values are never rendered from Helm values. Use existingSecret or ExternalSecret. */ -}}
{{- if and .Values.externalSecret.enabled (not .Values.existingSecret) }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "contextforge.fullname" . }}-app
  labels:
    {{- include "contextforge.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "contextforge.fullname" . }}-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteKey | quote }}
{{- end }}
