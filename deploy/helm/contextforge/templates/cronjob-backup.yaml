{{- if .Values.backupCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "contextforge.fullname" . }}-backup-postgres
  labels:
    {{- include "contextforge.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backupCronJob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup-postgres
              image: {{ .Values.backupCronJob.image | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "Run scripts/backup/backup_postgres.sh against the target Postgres service."
                  echo "Mount credentials via secret and push artifacts to object storage."
              envFrom:
                {{- if or .Values.existingSecret .Values.externalSecret.enabled }}
                - secretRef:
                    name: {{ default (printf "%s-app" (include "contextforge.fullname" .)) .Values.existingSecret }}
                {{- end }}
{{- end }}
