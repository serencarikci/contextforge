services:
  postgres:
    image: postgres:17-alpine
    container_name: contextforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextforge
      POSTGRES_PASSWORD: contextforge_dev_password
      POSTGRES_DB: contextforge
    ports:
      - "5432:5432"
    volumes:
      - contextforge_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextforge -d contextforge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - contextforge

  redis:
    image: redis:7-alpine
    container_name: contextforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - contextforge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - contextforge

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: contextforge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - contextforge_qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - contextforge

  minio:
    image: minio/minio:latest
    container_name: contextforge-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: contextforge_minio
      MINIO_ROOT_PASSWORD: contextforge_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - contextforge_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - contextforge

  minio-init:
    image: minio/mc:latest
    container_name: contextforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: contextforge_minio
      MINIO_ROOT_PASSWORD: contextforge_minio_secret
      MINIO_BUCKET: contextforge-documents
    volumes:
      - ./infrastructure/minio/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    restart: "no"
    networks:
      - contextforge

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextforge-migrate
    environment: &api-env
      CONTEXTFORGE_APP_NAME: contextforge-api
      CONTEXTFORGE_APP_ENVIRONMENT: local
      CONTEXTFORGE_APP_DEBUG: "false"
      CONTEXTFORGE_APP_VERSION: "0.6.0"
      CONTEXTFORGE_API_HOST: 0.0.0.0
      CONTEXTFORGE_API_PORT: "8000"
      CONTEXTFORGE_API_DOCS_ENABLED: "true"
      CONTEXTFORGE_API_CORS_ORIGINS: '["http://localhost:3001","http://127.0.0.1:3001"]'
      CONTEXTFORGE_POSTGRES_HOST: postgres
      CONTEXTFORGE_POSTGRES_PORT: "5432"
      CONTEXTFORGE_POSTGRES_USER: contextforge
      CONTEXTFORGE_POSTGRES_PASSWORD: contextforge_dev_password
      CONTEXTFORGE_POSTGRES_DATABASE: contextforge
      CONTEXTFORGE_REDIS_URL: redis://redis:6379/0
      CONTEXTFORGE_QDRANT_URL: http://qdrant:6333
      CONTEXTFORGE_MINIO_ENDPOINT: minio:9000
      CONTEXTFORGE_MINIO_ACCESS_KEY: contextforge_minio
      CONTEXTFORGE_MINIO_SECRET_KEY: contextforge_minio_secret
      CONTEXTFORGE_MINIO_BUCKET: contextforge-documents
      CONTEXTFORGE_MINIO_SECURE: "false"
      CONTEXTFORGE_LOGGING_LEVEL: INFO
      CONTEXTFORGE_LOGGING_FORMAT: json
      CONTEXTFORGE_LOGGING_SERVICE_NAME: contextforge-api
      CONTEXTFORGE_SECURITY_SECRET_KEY: change-me-local-only-not-for-production
      CONTEXTFORGE_RATE_LIMIT_ENABLED: "true"
      CONTEXTFORGE_RATE_LIMIT_BACKEND: memory
      CONTEXTFORGE_OBSERVABILITY_METRICS_ENABLED: "true"
      CONTEXTFORGE_RUN_MIGRATIONS: "true"
      CONTEXTFORGE_SKIP_HEALTHCHECK: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - contextforge

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextforge-api
    restart: unless-stopped
    environment:
      <<: *api-env
      CONTEXTFORGE_RUN_MIGRATIONS: "false"
      CONTEXTFORGE_SKIP_HEALTHCHECK: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/scripts/docker-healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - contextforge

  web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: contextforge-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - contextforge

  ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextforge-ingestion-worker
    restart: unless-stopped
    command: ["contextforge-ingestion-worker"]
    environment:
      <<: *api-env
      CONTEXTFORGE_RUN_MIGRATIONS: "false"
      CONTEXTFORGE_SKIP_HEALTHCHECK: "true"
      CONTEXTFORGE_LOGGING_SERVICE_NAME: contextforge-ingestion-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks:
      - contextforge

  retention-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contextforge-retention-worker
    restart: unless-stopped
    command: ["contextforge-retention-worker"]
    environment:
      <<: *api-env
      CONTEXTFORGE_RUN_MIGRATIONS: "false"
      CONTEXTFORGE_SKIP_HEALTHCHECK: "true"
      CONTEXTFORGE_LOGGING_SERVICE_NAME: contextforge-retention-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks:
      - contextforge

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    container_name: contextforge-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - contextforge_prometheus_data:/prometheus
    depends_on:
      - api
    networks:
      - contextforge

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.3.1
    container_name: contextforge-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - contextforge_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - contextforge

  loki:
    profiles: ["obs"]
    image: grafana/loki:3.2.1
    container_name: contextforge-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - contextforge

networks:
  contextforge:
    name: contextforge-network
    driver: bridge

volumes:
  contextforge_postgres_data:
  contextforge_redis_data:
  contextforge_qdrant_data:
  contextforge_minio_data:
  contextforge_prometheus_data:
  contextforge_grafana_data:
